<div class="dashboard">
  <aside>
    <app-sidebar
      [availableDevices]="availableDevices"
      [connectedDevice]="connectedDevice"
      (discoverClicked)="discoverDevices()"
      (connect)="connectDevice($event as any)"
      (disconnect)="disconnectDevice()">
    </app-sidebar>
  </aside>

  <main>
    <div class="header">
      <h2>Real-Time Visualization</h2>
      <div *ngIf="connectedDevice" class="conn-indicator">
        <span>Connected: </span>
        <span class="devname">{{ connectedDevice?.name }}</span>
      </div>
    </div>
    <app-realtime-chart [data]="realtimeChartData"></app-realtime-chart>
  </main>

  <section class="log-history-section">
    <app-log-history 
      [sessions]="sessions" 
      [currentSession]="currentSession"
      (exportFormat)="handleExport($event)"
      (clearLogs)="handleClear()"></app-log-history>
  </section>
</div>
